<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access - Nilashis Saha</title>
    <link rel="shortcut icon" href="/assets/images/favicon.svg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/styles.css?v={{ version }}">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4 font-space relative overflow-hidden">
    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-6">
                <a href="/" class="group flex items-center text-gray-900 font-bold text-lg hover:text-blue-600 transition-colors">
                    <i class="fas fa-arrow-left mr-2 transform group-hover:-translate-x-1 transition-transform"></i>
                    <span>Back to Home</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Decoration -->
    <div class="sprinkle sprinkle-circle top-40 left-10"></div>
    <div class="sprinkle sprinkle-star top-1/3 right-20"></div>
    <div class="sprinkle sprinkle-diamond bottom-20 left-1/4"></div>

    <div class="bg-white border border-gray-200 rounded-2xl p-8 sm:p-12 w-full max-w-md shadow-sm relative z-10 text-center">
        <h1 class="text-3xl font-bold text-gray-900 mb-3" style="font-family: 'Playfair Display', serif;">Secure Access</h1>
        <p class="text-gray-600 mb-8">Please enter the keyword to view documents.</p>

        <form action="/docs/auth" method="POST" class="space-y-6">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fas fa-key text-gray-400"></i>
                </div>
                <input type="password" name="keyword" required
                    class="w-full pl-11 pr-4 py-3 border border-gray-300 rounded-xl text-gray-900 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-all placeholder-gray-400"
                    placeholder="Enter keyword...">
            </div>

            {% if error %}
            <div class="text-red-500 text-sm font-medium">
                {{ error }}
            </div>
            {% endif %}

            <button type="submit" class="w-full bg-gray-900 text-white font-semibold py-3 rounded-xl hover:bg-gray-800 transition-colors">
                Unlock Documents
            </button>
        </form>
    </div>
</body>
</html>
