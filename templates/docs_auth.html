<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access - Nilashis Saha</title>
    <link rel="shortcut icon" href="/assets/images/favicon.svg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/styles.css?v={{ version }}">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4 font-space relative overflow-hidden">
    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-6">
                <a href="/" class="group flex items-center text-gray-900 font-bold text-lg hover:text-blue-600 transition-colors">
                    <i class="fas fa-arrow-left mr-2 transform group-hover:-translate-x-1 transition-transform"></i>
                    <span>Back to Home</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Decoration -->
    <div class="sprinkle sprinkle-circle top-40 left-10"></div>
    <div class="sprinkle sprinkle-star top-1/3 right-20"></div>
    <div class="sprinkle sprinkle-diamond bottom-20 left-1/4"></div>

    <div class="bg-white border border-gray-200 rounded-2xl p-8 sm:p-12 w-full max-w-md shadow-sm relative z-10 text-center">
        <h1 class="text-3xl font-bold text-gray-900 mb-2" style="font-family: 'Playfair Display', serif;">Secure Access</h1>
        <p class="text-gray-500 mb-8 text-sm" id="instruction-text">Enter the 6-digit code from your Authenticator app.</p>

        {% if error %}
        <div id="error-alert" class="mb-6 text-sm text-red-500 font-medium animate-fade-in transition-opacity duration-300">
            {{ error }}
        </div>
        {% endif %}

        <form action="/docs/auth" method="POST" id="totp-form">
            <!-- OTP 6-Box Section -->
            <div class="flex justify-center gap-1 sm:gap-2 mb-8 transition-all duration-300" id="otp-inputs">
                <input type="text" maxlength="1" inputmode="numeric" class="w-10 h-12 sm:w-14 sm:h-14 text-center text-xl sm:text-2xl font-semibold border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-900 focus:border-transparent outline-none transition-all text-gray-900 bg-white">
                <input type="text" maxlength="1" inputmode="numeric" class="w-10 h-12 sm:w-14 sm:h-14 text-center text-xl sm:text-2xl font-semibold border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-900 focus:border-transparent outline-none transition-all text-gray-900 bg-white">
                <input type="text" maxlength="1" inputmode="numeric" class="w-10 h-12 sm:w-14 sm:h-14 text-center text-xl sm:text-2xl font-semibold border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-900 focus:border-transparent outline-none transition-all text-gray-900 bg-white">
                <input type="text" maxlength="1" inputmode="numeric" class="w-10 h-12 sm:w-14 sm:h-14 text-center text-xl sm:text-2xl font-semibold border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-900 focus:border-transparent outline-none transition-all text-gray-900 bg-white">
                <input type="text" maxlength="1" inputmode="numeric" class="w-10 h-12 sm:w-14 sm:h-14 text-center text-xl sm:text-2xl font-semibold border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-900 focus:border-transparent outline-none transition-all text-gray-900 bg-white">
                <input type="text" maxlength="1" inputmode="numeric" class="w-10 h-12 sm:w-14 sm:h-14 text-center text-xl sm:text-2xl font-semibold border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-900 focus:border-transparent outline-none transition-all text-gray-900 bg-white">
            </div>

            <input type="hidden" name="otp_code" id="otp-code">

            <!-- Verify OTP Button -->
            <button type="submit" id="verify-otp-btn" disabled class="w-full bg-gray-700 text-white font-semibold py-4 rounded-xl hover:bg-gray-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                Verify
            </button>
        </form>
    </div>

    <script>
        const inputs = document.querySelectorAll('#otp-inputs input');
        const verifyOtpBtn = document.getElementById('verify-otp-btn');
        const otpCodeHidden = document.getElementById('otp-code');
        const form = document.getElementById('totp-form');

        // Input interactions
        inputs.forEach(function(input, index) {
            input.addEventListener('input', function(e) {
                // Clear error UI if user starts typing again
                const errorAlert = document.getElementById('error-alert');
                if (errorAlert) {
                    errorAlert.style.opacity = '0';
                    setTimeout(() => errorAlert.remove(), 300);
                }

                e.target.value = e.target.value.replace(/[^0-9]/g, '');
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
                checkOTPComplete();
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                    inputs[index - 1].value = '';
                    checkOTPComplete();
                }
            });

            input.addEventListener('paste', function(e) {
                e.preventDefault();
                var pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 6);
                if (pastedData) {
                    for (var i = 0; i < pastedData.length; i++) {
                        if (inputs[i]) inputs[i].value = pastedData[i];
                    }
                    if (pastedData.length === 6) {
                        inputs[5].focus();
                    } else if (inputs[pastedData.length]) {
                        inputs[pastedData.length].focus();
                    }
                    checkOTPComplete();
                }
            });
        });

        function getOTPCode() {
            var code = '';
            inputs.forEach(function(input) { code += input.value; });
            return code;
        }

        function checkOTPComplete() {
            var code = getOTPCode();
            otpCodeHidden.value = code;
            if (code.length === 6) {
                verifyOtpBtn.disabled = false;
            } else {
                verifyOtpBtn.disabled = true;
            }
        }

        form.addEventListener('submit', function() {
            verifyOtpBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Verifying...';
            verifyOtpBtn.disabled = true;
        });

        // Focus first input on load
        window.addEventListener('load', function() {
            inputs[0].focus();
        });
    </script>
</body>
</html>
