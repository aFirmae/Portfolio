<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Too Many Requests - Nilashis Saha</title>
    <link rel="shortcut icon" href="/assets/images/favicon.svg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/styles.css?v={{ version }}">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4 font-space">
    <div class="text-center max-w-md mx-auto">
        <div class="w-20 h-20 bg-gray-200 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-hand-paper text-3xl text-gray-500"></i>
        </div>
        <h1 class="text-4xl font-bold text-gray-900 mb-4" style="font-family: 'Playfair Display', serif;">Whoa there!</h1>
        <h2 class="text-xl font-medium text-gray-700 mb-4">Too Many Requests</h2>
        <p class="text-gray-600 mb-8">You've been sending requests a little too fast. Please take a breather and try again in a moment.</p>
        <button onclick="window.history.back()" class="inline-flex items-center bg-gray-900 text-white font-semibold px-6 py-3 rounded-full hover:bg-gray-800 transition-colors">
            <i class="fas fa-arrow-left mr-2"></i>
            Go Back
        </button>
    </div>
</body>
</html>
